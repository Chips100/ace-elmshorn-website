<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="icon" type="image/png" href="images/ace-logo.png" />
    <title>AC Einigkeit Elmshorn</title>

    <!-- Loading Bootstrap from CDN. -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
        crossorigin="anonymous"></script>

    <style>
        :root {
            --bs-bg-1: #ffcb33; /* ACE yellow for default background color in Bootstrap. */
            --bs-theme-fg: black;
            --bs-theme-fg-emphasis: black;
        }
        .navbar .btn-icon {
            --bs-btn-color: black;
        }
        dialog.drawer[open] a {
            --bs-theme-fg: var(--bs-navbar-active-color);
            --bs-theme-fg-emphasis: var(--bs-nav-link-hover-color);
        }
        a.price-tag {
            margin-block-start: 5rem;
            margin-block-end: 2rem;
            left: auto;
            right: 2rem;
            border-radius: 50%;
            width: 7.5rem;
            height: 7.5rem;
            rotate: -15deg;
            text-align: center;
            padding-top: 1.5rem;
            background: var(--bs-bg-1);
            color: var(--bs-theme-fg);
        }
        a.price-tag .price-value {
            font-size: 1.7rem;
            line-height: 0.5rem;
        }
    </style>
</head>

<body>
    <!-- Header Navbar -->
    <nav class="navbar md:navbar-expand bg-1 fg-2">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">
                <img src="images/ace-logo.png" alt="AC Einigkeit Elmshorn Logo" width="30" height="24" class="d-inline-block align-text-top">
                AC Einigkeit Elmshorn
            </a>
            <button class="btn-icon navbar-toggler" type="button" data-bs-toggle="drawer"
                data-bs-target="#navbarLeftDrawer" aria-controls="navbarLeftDrawer" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon" aria-hidden="true"></span>
            </button>
            <dialog class="drawer drawer-start" tabindex="-1" id="navbarLeftDrawer"
                aria-labelledby="navbarLeftDrawerLabel">
                <div class="drawer-header">
                    <h5 class="drawer-title" id="navbarLeftDrawerLabel">Menü</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="drawer" aria-label="Close"></button>
                </div>
                <div class="drawer-body">
                    <ul class="navbar-nav me-auto mb-2 md:mb-0">
                        <li class="nav-item"><a class="nav-link active" aria-current="page" href="#">Aktuelles</a></li>
                        <li class="nav-item"><a class="nav-link" href="#">Termine</a></li>
                    </ul>
                </div>
            </dialog>
        </div>
    </nav>

    <a href="#" class="fixed-bottom theme-primary-bg w-5 h-5 card hover-lift price-tag text-decoration-none">
        <div class="card-body"><strong class="price-value">2,50&nbsp;€</strong><small>pro Monat</small></div>
    </a>

    <div>
        <strong>Diese Seite ist kein offizielles Angebot des AC Einigkeit Elmshorn e.V. und dient nur zu Evaluationszwecken!</strong>
    </div>
</body>

</html>
